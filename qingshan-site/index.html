<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>青山帮战报名</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="shell is-auth">
    <header class="hero">
      <div class="hero-copy">
        <span class="guild-mark" aria-hidden="true">青</span>
        <p class="hero-game">逆水寒手游</p>
        <h1><span>青山</span>帮战报名</h1>
        <p id="event-time" hidden></p>
      </div>
      <div class="hero-art">
        <img src="/character-cover.webp" alt="青山原创二次元群像，铁衣、素问与碎梦职业风格" fetchpriority="high" width="1460" height="973">
        <ul class="hero-classes" aria-label="插画中的职业"><li>铁衣</li><li>素问</li><li>碎梦</li></ul>
      </div>
    </header>
    <div id="app"><p class="notice">正在打开报名页…</p></div>
    <p id="notice" role="status" aria-live="polite" hidden></p>
  </main>
  <dialog id="editor" aria-labelledby="editor-title"></dialog>
</body>
</html>
